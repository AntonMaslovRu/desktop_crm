name: Mac app

on:
  push:
    branches: ["**"]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app && xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen create-dmg >/dev/null && cd mac && xcodegen generate

      - name: Сертификат
        if: env.HAS_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Сборка
        run: |
          cd mac
          if [ "$HAS_CERT" = "true" ]; then
            xcodebuild -project EnvoDesk.xcodeproj -scheme EnvoDesk -configuration Release \
              -derivedDataPath build CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" build | tail -40
          else
            xcodebuild -project EnvoDesk.xcodeproj -scheme EnvoDesk -configuration Release \
              -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- build | tail -40
          fi
          ls -la build/Build/Products/Release/

      - name: DMG
        run: |
          cd mac
          create-dmg --volname "Envo Desk" --window-size 520 320 --icon-size 100 \
            --icon "Envo Desk.app" 130 150 --app-drop-link 390 150 \
            "EnvoDesk.dmg" "build/Build/Products/Release/Envo Desk.app" || \
          hdiutil create -volname "Envo Desk" -srcfolder "build/Build/Products/Release/Envo Desk.app" -ov -format UDZO EnvoDesk.dmg
          ls -la EnvoDesk.dmg

      - name: Нотаризация
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          cd mac
          echo "$NOTARY_KEY_P8" > AuthKey.p8
          codesign --force --sign "Developer ID Application" --timestamp EnvoDesk.dmg
          xcrun notarytool submit EnvoDesk.dmg --key AuthKey.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple EnvoDesk.dmg
          rm AuthKey.p8

      - uses: actions/upload-artifact@v4
        with:
          name: EnvoDesk.dmg
          path: mac/EnvoDesk.dmg

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Envo Desk · сборка ${{ github.run_number }}
          files: mac/EnvoDesk.dmg
          prerelease: true
