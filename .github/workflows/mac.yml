name: Mac app

on:
  push:
    branches: ["**"]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen create-dmg >/dev/null && cd mac && xcodegen generate

      - name: Сертификат
        if: env.HAS_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          # промежуточный сертификат Apple, без него подпись не строит цепочку доверия
          curl -sSLo DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain -T /usr/bin/codesign || true
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Сборка
        run: |
          cd mac
          if [ "$HAS_CERT" = "true" ]; then
            xcodebuild -project EnvoDesk.xcodeproj -scheme EnvoDesk -configuration Release \
              -derivedDataPath build CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" build | tail -40
          else
            xcodebuild -project EnvoDesk.xcodeproj -scheme EnvoDesk -configuration Release \
              -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- build | tail -40
          fi
          ls -la build/Build/Products/Release/

      - name: DMG
        run: |
          cd mac
          create-dmg --volname "Envo Desk" --window-size 520 320 --icon-size 100 \
            --icon "Envo Desk.app" 130 150 --app-drop-link 390 150 \
            "EnvoDesk.dmg" "build/Build/Products/Release/Envo Desk.app" || \
          hdiutil create -volname "Envo Desk" -srcfolder "build/Build/Products/Release/Envo Desk.app" -ov -format UDZO EnvoDesk.dmg
          ls -la EnvoDesk.dmg

      - name: Нотаризация
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          cd mac
          echo "$NOTARY_KEY_P8" > AuthKey.p8
          codesign --force --sign "Developer ID Application" --timestamp EnvoDesk.dmg
          # Очередь Apple бывает часами. Подписанный .dmg — уже результат, поэтому
          # нотаризация здесь попытка, а не условие: не успела — выпускаем без неё.
          set +e
          xcrun notarytool submit EnvoDesk.dmg --key AuthKey.p8 --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 25m --output-format json > notary.json 2>&1
          STATUS=$(python3 -c 'import json;print(json.load(open("notary.json")).get("status",""))' 2>/dev/null || echo "")
          set -e
          cat notary.json
          if [ "$STATUS" = "Accepted" ]; then
            xcrun stapler staple EnvoDesk.dmg
            echo "NOTARIZED=yes" >> "$GITHUB_ENV"
            echo "Нотаризация пройдена: ставится обычным двойным кликом."
          else
            echo "NOTARIZED=no" >> "$GITHUB_ENV"
            echo "::warning::Apple не подтвердила за 25 минут (status='$STATUS'). Выпускаем подписанный, но не нотаризованный .dmg — первый запуск через правый клик → «Открыть»."
          fi
          rm AuthKey.p8

      - uses: actions/upload-artifact@v4
        with:
          name: EnvoDesk.dmg
          path: mac/EnvoDesk.dmg

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Envo Desk · сборка ${{ github.run_number }}
          body: |
            Подпись: ${{ env.HAS_CERT == 'true' && 'Developer ID' || 'нет' }} · нотаризация: ${{ env.NOTARIZED || 'нет' }}
            Если нотаризации нет — первый запуск через правый клик → «Открыть».
          files: mac/EnvoDesk.dmg
          prerelease: true
