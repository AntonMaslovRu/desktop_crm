# XcodeGen: проект генерируется в CI, в репозитории только исходники.
name: EnvoDesk
options:
  bundleIdPrefix: live.envo
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
targets:
  EnvoDesk:
    type: application
    platform: macOS
    sources:
      - path: EnvoDesk
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Envo Desk
        CFBundleName: Envo Desk
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: Envo
        LSApplicationCategoryType: public.app-category.business
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Resources/EnvoDesk.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.envo.desk
        PRODUCT_NAME: Envo Desk
